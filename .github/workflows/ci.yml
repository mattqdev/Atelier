name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        run: for f in app/*.js app/locales/*.js projects/example/manifest.js; do node --check "$f"; done
      - name: Python syntax
        run: python3 -m py_compile atelier.py
      - name: i18n and manifest
        run: node .github/scripts/check.mjs

  smoke:
    name: Headless smoke test
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Chrome wrapper
        run: |
          printf '#!/bin/sh\nexec google-chrome --no-sandbox "$@"\n' > "$RUNNER_TEMP/chrome"
          chmod +x "$RUNNER_TEMP/chrome"
          echo "ATELIER_CHROME=$RUNNER_TEMP/chrome" >> "$GITHUB_ENV"
      - name: Screenshot canvas and viewer from file://
        run: |
          mkdir -p shots
          "$ATELIER_CHROME" --headless=new --hide-scrollbars --window-size=1600,1000 --virtual-time-budget=5000 \
            --screenshot=shots/canvas.png "file://$PWD/Atelier.html?p=example"
          "$ATELIER_CHROME" --headless=new --hide-scrollbars --window-size=1600,1000 --virtual-time-budget=5000 \
            --screenshot=shots/viewer.png "file://$PWD/view.html?p=example&b=welcome"
          test -s shots/canvas.png && test -s shots/viewer.png
      - name: Export through atelier.py
        run: |
          python3 atelier.py --no-open --port 4747 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:4747/__atelier/ping && break; sleep 0.5; done
          curl -sf http://127.0.0.1:4747/__atelier/ping | grep -q '"export": true'
          q="src=projects/example/boards/welcome.html&w=1080&h=1350"
          curl -sf -o shots/welcome.png "http://127.0.0.1:4747/__atelier/render?$q&scale=1&format=png"
          curl -sf -o shots/welcome.pdf "http://127.0.0.1:4747/__atelier/render?$q&format=pdf"
          file shots/welcome.png | grep -q 'PNG image data, 1080 x 1350'
          head -c 4 shots/welcome.pdf | grep -q '%PDF'
          # must refuse anything outside projects/
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:4747/__atelier/render?src=atelier.py&w=10&h=10")" = 404
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/

  launcher:
    name: Launcher (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install launcher
        run: python atelier.py --install-launcher
      - name: Check macOS app
        if: runner.os == 'macOS'
        run: |
          app="$HOME/Applications/Atelier.app/Contents"
          test -x "$app/MacOS/Atelier" && test -s "$app/Resources/Atelier.icns" && plutil -lint "$app/Info.plist"
          bash -n "$app/MacOS/Atelier"
      - name: Check Linux desktop entry
        if: runner.os == 'Linux'
        run: grep -q '^Exec=.*atelier.py' "$HOME/.local/share/applications/atelier.desktop"
      - name: Check Windows shortcut
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $lnk = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Atelier.lnk'
          $s = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk)
          if (-not (Test-Path $s.TargetPath) -or $s.Arguments -notmatch 'atelier.py') { exit 1 }
      - name: Server starts and a second launch reuses it
        shell: bash
        run: |
          python atelier.py --no-open --port 4747 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:4747/__atelier/ping && break; sleep 0.5; done
          python atelier.py --no-open --port 4747 | grep -q 'already running'
