<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Welcome</title>
<style>
  @page { size: 1080px 1350px; margin: 0; }
  :root { --bg: #F4F1EA; --ink: #1E1E1E; --accent: #0D99FF; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; background: var(--bg); }
  .page { width: 1080px; height: 1350px; padding: 110px; display: flex; flex-direction: column; justify-content: space-between;
          font: 32px/1.45 -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; color: var(--ink); }
  h1 { font-size: 150px; line-height: .9; letter-spacing: -.04em; }
  h1 span { color: var(--accent); }
  ol { padding-left: 1.2em; } li { margin: .3em 0; }
  code { font: 28px ui-monospace, Menlo, monospace; background: #fff; padding: 2px 10px; border-radius: 8px; }
</style>
</head>
<body>
<section class="page">
  <h1>Atelier<span>.</span></h1>
  <ol>
    <li>Create <code>projects/&lt;Name&gt;/</code></li>
    <li>Add <code>manifest.js</code> and the boards in <code>boards/</code></li>
    <li>Register the project in <code>projects/index.js</code></li>
  </ol>
  <p>One board = one HTML file. The top menu switches project.</p>
</section>
</body>
</html>
